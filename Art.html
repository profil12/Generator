<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, #1a1a3e, #0a0a1a 80%);
        }
        .container {
            max-width: 960px;
            width: 100%;
            background: rgba(20, 20, 50, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 40px;
            border-radius: 40px;
            border: 1px solid rgba(108, 60, 225, 0.35);
            box-shadow: 0 0 60px rgba(108, 60, 225, 0.15);
            transition: 0.3s;
        }
        .container:hover { box-shadow: 0 0 80px rgba(108, 60, 225, 0.3); }
        h1 {
            font-size: 34px;
            background: linear-gradient(135deg, #00D4FF, #6C3CE1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            letter-spacing: 2px;
        }
        .sub {
            text-align: center;
            color: #8888bb;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 24px;
            font-family: 'Segoe UI', sans-serif;
        }
        label {
            color: #b0b0dd;
            font-weight: 600;
            display: block;
            margin: 18px 0 6px;
            font-size: 14px;
            letter-spacing: 1px;
        }
        input[type="file"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid #2a2a5a;
            background: rgba(10, 10, 30, 0.7);
            color: #e0e0ff;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
        }
        input[type="file"]::file-selector-button {
            background: #1f1f3a;
            color: #b0b0dd;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        input[type="file"]::file-selector-button:hover { background: #2a2a4a; border-color: #6C3CE1; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            margin: 16px 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .controls label {
            color: #b0b0dd;
            font-weight: 600;
            font-size: 14px;
            margin: 0;
        }
        .controls input[type="range"] {
            flex: 1;
            min-width: 150px;
            accent-color: #6C3CE1;
            background: #1f1f3a;
            height: 4px;
            border-radius: 4px;
            cursor: pointer;
        }
        .controls span {
            color: #00ffcc;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .btn {
            background: linear-gradient(135deg, #6C3CE1, #00D4FF);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            transition: 0.25s;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        .btn:hover { transform: scale(1.04); box-shadow: 0 0 30px rgba(108, 60, 225, 0.4); }
        .btn-sm {
            background: #1f1f3a;
            border: 1px solid #3a3a5a;
            padding: 10px 22px;
            border-radius: 30px;
            color: #b0b0dd;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.2s;
        }
        .btn-sm:hover { background: #2a2a4a; border-color: #6C3CE1; }
        .badge {
            background: #1f1f3a;
            padding: 4px 14px;
            border-radius: 30px;
            color: #8888bb;
            font-size: 12px;
            font-family: 'Segoe UI', sans-serif;
        }
        pre {
            background: rgba(10, 10, 30, 0.85);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid #2a2a5a;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 12px;
            margin-top: 20px;
            color: #00ffcc;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            line-height: 1.4;
            box-shadow: inset 0 0 30px rgba(0, 255, 204, 0.04);
        }
        hr {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, #6C3CE1, transparent);
            margin: 24px 0;
        }
        footer {
            text-align: center;
            margin-top: 24px;
            color: #444466;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .mode-hint {
            color: #8888bb;
            font-size: 12px;
            margin: 6px 0 0;
            font-family: 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🦉 ASCII-ГЕНЕРАТОР</h1>
    <div class="sub">✦ ширина от 10 до 120 ✦</div>

    <label>🖼️ Загрузите изображение</label>
    <input type="file" id="imageInput" accept="image/*">

    <div class="controls">
        <label>📐 Ширина:</label>
        <input type="range" id="widthSlider" min="10" max="120" value="80">
        <span id="widthValue">80</span>
        <label style="margin-left: 16px;">Высота:</label>
        <span id="heightValue">40</span>
    </div>

    <div class="btn-group">
        <button class="btn" onclick="generateImage()">🚀 Сгенерировать</button>
        <button class="btn-sm" onclick="copyOutput()">📋 Копировать</button>
        <button class="btn-sm" onclick="downloadOutput()">💾 Скачать .txt</button>
        <span class="badge">⚡ палитра: 10 символов</span>
    </div>
    <div class="mode-hint">⚡ авто-высота = ширина / 2</div>

    <pre id="output">Загрузите картинку и нажмите «Сгенерировать»</pre>

    <hr>
    <footer>⏤  КиберСова · гибкий контроль  ⏤</footer>
</div>

<script>
    let currentImageData = null;
    let currentWidth = 80;
    let currentHeight = 40;

    const slider = document.getElementById('widthSlider');
    const widthDisplay = document.getElementById('widthValue');
    const heightDisplay = document.getElementById('heightValue');

    slider.addEventListener('input', function() {
        currentWidth = parseInt(this.value);
        currentHeight = Math.round(currentWidth / 2);
        widthDisplay.textContent = currentWidth;
        heightDisplay.textContent = currentHeight;
    });

    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const previewWidth = 200;
                const previewHeight = 100;
                canvas.width = previewWidth;
                canvas.height = previewHeight;
                ctx.drawImage(img, 0, 0, previewWidth, previewHeight);
                currentImageData = ctx.getImageData(0, 0, previewWidth, previewHeight).data;
                document.getElementById('output').textContent = '✅ Картинка загружена. Настройте ширину и нажмите «Сгенерировать».';
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });

    function generateImage() {
        if (!currentImageData) {
            alert('Сначала загрузите картинку!');
            return;
        }

        const data = currentImageData;
        const width = currentWidth;
        const height = currentHeight;

        const bgR = data[0];
        const bgG = data[1];
        const bgB = data[2];
        const bgTolerance = 30;
        const chars = ' .:-=+*#%@';

        let result = '';
        const stepX = 200 / width;
        const stepY = 100 / height;

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const px = Math.floor(x * stepX);
                const py = Math.floor(y * stepY);
                const i = (py * 200 + px) * 4;
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                const diff = Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB);
                if (diff < bgTolerance) {
                    result += ' ';
                } else {
                    const brightness = (r + g + b) / 3;
                    const idx = Math.floor((brightness / 255) * (chars.length - 1));
                    result += chars[idx];
                }
            }
            result += '\n';
        }

        document.getElementById('output').textContent = result;
    }

    function copyOutput() {
        const text = document.getElementById('output').textContent;
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        alert('✅ ASCII-арт скопирован!');
    }

    function downloadOutput() {
        const text = document.getElementById('output').textContent;
        const blob = new Blob([text], { type: 'text/plain' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'ascii_art.txt';
        link.click();
    }
</script>

</body>
</html>
